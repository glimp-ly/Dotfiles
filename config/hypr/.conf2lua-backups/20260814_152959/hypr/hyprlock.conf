# ============================================================================
# Hyprlock Configuration with Music Player Widget
# ============================================================================

# ----------------------------------------------------------------------------
# Background
# ----------------------------------------------------------------------------
background {
    monitor =
    path = $HOME/Pictures/Wallpapers/momo1.jpeg
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ----------------------------------------------------------------------------
# General Settings
# ----------------------------------------------------------------------------
general {
    ignore_empty_input = true
    hide_cursor = true
}

# ----------------------------------------------------------------------------
# Animations
# ----------------------------------------------------------------------------
animations {
    animation = fade,    1, 6, default
    animation = fadeIn,  1, 6, default
    animation = fadeOut, 1, 6, default
}

# ----------------------------------------------------------------------------
# Password Input Field
# ----------------------------------------------------------------------------
input-field {
    monitor =
    size = 300, 55
    outline_thickness = 2
    dots_size = 0.2      # Scale of input-field height (0.2 - 0.8)
    dots_spacing = 0.2   # Scale of dots' absolute size (0.0 - 1.0)
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(100, 114, 125, 0.4)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = SF Pro Display Bold Italic
    placeholder_text = <span foreground="##ffffff99">Enter Pass</span>
    hide_input = false
    position = 0, -230
    halign = center
    valign = center
}

# ----------------------------------------------------------------------------
# Clock & Date Display
# ----------------------------------------------------------------------------

# Date (day)
label {
    monitor =
    text = cmd[update:1000] date +"%A" | tr '[:lower:]' '[:upper:]' | sed 's/./& /g'
    font_family = Anurati
    font_size = 130
    color = rgba(255, 255, 255, 0.80)
    position = 0, 280
    halign = center
    valign = center
}

# Date (num day, month, year)
label {
    monitor =
    text = cmd[update:1000] date +"%d %B %Y" | tr '[:lower:]' '[:upper:]'
    font_family = SF Pro Display Bold
    font_size = 30
    color = rgba(255, 255, 255, 0.7)
    position = 0, 190
    halign = center
    valign = center
}

# Time (large display)
label {
    monitor =
    text = - $TIME -
    color = rgba(216, 222, 233, 0.70)
    font_size = 80
    font_family = SF Pro Display Bold
    position = 0, 120
    halign = center
    valign = center
}

# Lock Icon
label {
    monitor =
    text = <span> </span>
    color = rgba(216, 222, 233, 0.70)
    font_size = 24
    font_family = SF Pro Display Bold
    position = 2, -110
    halign = center
    valign = top
}

# ----------------------------------------------------------------------------
# User Profile
# ----------------------------------------------------------------------------

# Profile photo
image {
    monitor =
    path = $HOME/Pictures/hyprlock_pfp.jpg
    border_color = rgba(216, 222, 233, 0.70)
    border_size = 3
    size = 180
    rounding = -1       # -1 = circle
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, -50
    halign = center
    valign = center
}

# Username greeting
label {
    monitor =
    text = Ey, $USER
    color = rgba(216, 222, 233, 0.70)
    font_size = 20
    font_family = SF Pro Display Bold Italic
    position = 0, -170
    halign = center
    valign = center
}

